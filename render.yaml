services:
  # ─── Backend: FastAPI ───────────────────────────────────────────────────────
  - type: web
    name: civicpulse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: BACKEND_HOST
        value: "0.0.0.0"
      - key: BACKEND_PORT
        fromEnv: PORT
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: civicpulse-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://civicpulse-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://civicpulse-frontend.onrender.com

  # ─── Frontend: Vite/React Static Site ────────────────────────────────────────
  - type: web
    name: civicpulse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://civicpulse-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─── Database ────────────────────────────────────────────────────────────────
databases:
  - name: civicpulse-db
    databaseName: civicpulse
    user: civicpulse_user
    plan: free
