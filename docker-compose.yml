version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicpulse_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://USER:PASSWORD@host.docker.internal:3306/civicpulse_real?charset=utf8mb4
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ENVIRONMENT: development
      DEBUG: "True"
